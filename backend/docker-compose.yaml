# Backend stack: postgres + redis + backend.
# The full stack (this file + the frontend) is ../docker-compose.yaml, started by ../scripts/start-*.
# Both files form the same compose project "backend", so they share the containers and the
# database volume (backend_postgres-data).
# Host ports can be changed with POSTGRES_PORT, REDIS_PORT and BACKEND_PORT.
name: backend

services:
  postgres:
    # postgres:17-alpine + the pgvector extension (RAG vector store, V1.0.14__schema_rag.sql);
    # same PostgreSQL major version, so the existing data volume is used as it is
    build:
      context: postgres
      dockerfile: Dockerfile
    image: neracalab-postgres:17-pgvector
    container_name: neracalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-neracalab}
      POSTGRES_USER: ${DB_USERNAME:-neracalab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neracalab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neracalab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-neracalab}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-neracalab}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neracalab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-neracalab}
      DB_USERNAME: ${DB_USERNAME:-neracalab}
      DB_PASSWORD: ${DB_PASSWORD:-neracalab}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-neracalab}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      # AI ingestion (values from backend/.env, which compose reads automatically; never baked into the image)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek/deepseek-v4-flash-0731}
      # daily price ingestion (yahoo needs no key; eodhd is the paid fallback)
      PRICE_PROVIDER: ${PRICE_PROVIDER:-yahoo}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      PRICE_SCHEDULE_ENABLED: ${PRICE_SCHEDULE_ENABLED:-false}
      # AI stock screening: Tavily news search, cost cap per run, daily screening data ETL
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SCREENING_BUDGET_USD: ${SCREENING_BUDGET_USD:-0.45}
      SCREENING_ETL_SCHEDULE_ENABLED: ${SCREENING_ETL_SCHEDULE_ENABLED:-true}
      # AI analysis of one stock (Screening > Analysis): cost cap per analysis
      ANALYSIS_BUDGET_USD: ${ANALYSIS_BUDGET_USD:-0.20}
      # RAG vector store: embedding model (OpenRouter, same OPENAI_API_KEY; must have 1536 dimensions)
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      # login: session length, initial password of the root user "admin" (first start only)
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      AUTH_ROOT_PASSWORD: ${AUTH_ROOT_PASSWORD:-admin}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # ready once the API answers (first start also runs the SQL scripts); the only public read endpoint
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 24

volumes:
  postgres-data:
  redis-data:
