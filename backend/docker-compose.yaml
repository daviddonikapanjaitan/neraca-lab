services:
  postgres:
    image: postgres:17-alpine
    container_name: neracalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-neracalab}
      POSTGRES_USER: ${DB_USERNAME:-neracalab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neracalab}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neracalab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-neracalab}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-neracalab}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neracalab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-neracalab}
      DB_USERNAME: ${DB_USERNAME:-neracalab}
      DB_PASSWORD: ${DB_PASSWORD:-neracalab}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-neracalab}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
