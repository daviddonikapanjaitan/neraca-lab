# Tests only (read beside src/main/resources/application.yaml, which it overrides): the suite keeps one application
# context per distinct test configuration open, each with its own connection pool, against the same Postgres as the
# running backend (max_connections 100). With Hikari's default of 10 connections per pool, kept open even when idle,
# the suite ran out of connections ("FATAL: sorry, too many clients already") once the backend was busy with
# uploads: 138 tests failed to start their context. Small pools that release idle connections keep it well below.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000

# A test context is a second instance on the live database: it must not fail the jobs the running backend is working
# on (IngestionJobRecovery; a run on 2026-10-31 failed 170 queued Hermes uploads).
neracalab.jobs.recover-on-start=false

# Uploads in tests never write the workbook's text into the live RAG vector store (an embedding call per upload);
# XbrlRagServiceTest covers that step with a stub embedding client.
neracalab.ingestion.rag-after-upload=false
