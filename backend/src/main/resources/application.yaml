spring:
  application:
    name: backend
  config:
    # Local secrets (OPENAI_API_KEY, ...) from backend/.env; the file is git- and docker-ignored.
    # Real environment variables take precedence.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    # Spring AI is used for chat only (Spring AI's own embedding / image / audio models are off). The RAG
    # embeddings call OpenRouter's OpenAI-compatible /embeddings directly (neracalab.rag below).
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        model: ${OPENAI_MODEL:deepseek/deepseek-v4-flash-0731}
        parallel-tool-calls: true
        timeout: 180s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neracalab}
    username: ${DB_USERNAME:neracalab}
    password: ${DB_PASSWORD:neracalab}
  sql:
    init:
      # Plain SQL scripts instead of Flyway (V1.0.1, V1.0.2, V1.0.3 ... run in the listed order);
      # all scripts are idempotent and run on every start. Add new scripts to the lists below;
      # company data scripts go before V1.0.6 (it derives metrics from all loaded data).
      mode: ${SQL_INIT_MODE:always}
      schema-locations:
        - classpath:db/V1.0.1__schema.sql
        - classpath:db/V1.0.2__schema_market_valuation.sql
        - classpath:db/V1.0.3__views.sql
        - classpath:db/V1.0.7__schema_ingestion.sql
        - classpath:db/V1.0.8__schema_auth.sql
        - classpath:db/V1.0.9__schema_ingestion_created_by.sql
        - classpath:db/V1.0.10__schema_screening.sql
        - classpath:db/V1.0.11__schema_fx.sql
        - classpath:db/V1.0.14__schema_rag.sql      # RAG vector store (needs pgvector)
        - classpath:db/V1.0.15__schema_analysis.sql # AI analysis of one stock
        - classpath:db/V1.0.16__schema_syirkah.sql  # banks: temporary syirkah funds beside liabilities
        - classpath:db/V1.0.17__schema_screening_selection.sql # screening of selected stocks
      data-locations:
        - classpath:db/V1.0.4__data_HRTA_financials.sql
        - classpath:db/V1.0.5__data_HRTA_market.sql
        - classpath:db/V1.0.12__data_SMDR_shares.sql      # share counts not derivable from the filings
        - classpath:db/V1.0.13__data_BNGA_shares.sql      # share counts not derivable from the filings
        - classpath:db/V1.0.6__data_metrics_valuation.sql
      continue-on-error: false
  jpa:
    hibernate:
      # Schema is owned by the SQL scripts above; Hibernate must not alter it.
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false

neracalab:
  # Login (POST /api/v1/auth/login); every other API needs the bearer token of a session
  auth:
    session-ttl: ${AUTH_SESSION_TTL:12h}            # a login is valid this long
    root-password: ${AUTH_ROOT_PASSWORD:admin}      # password of the root user "admin" when it is first created

  # AI ingestion agent (POST /api/v1/financial-statements/upload)
  ingestion:
    max-iterations: 30      # model turns per execution round
    reflection-rounds: 2    # extra rounds the reviewer may request
    temperature: 0.0
    model-retries: 2        # retries of a model call that failed transiently (timeout, network, 408/429/5xx)
    retry-backoff: 2s       # pause before the first retry, doubled for each further one
    model-reasoning: ${INGESTION_MODEL_REASONING:false}   # let a reasoning model think first (slow: 69 s vs 10 s per plan)
    model-call-timeout: ${INGESTION_MODEL_CALL_TIMEOUT:45s}   # a model call taking longer counts as stalled and is retried
    web-share-counts: ${INGESTION_WEB_SHARE_COUNTS:true}   # Yahoo Finance share counts when a filing gives none
    job-timeout: ${INGESTION_JOB_TIMEOUT:5m}   # an upload job running longer is stopped and FAILED (queue time not counted)

  # Daily price ingestion (POST /api/v1/prices/ingestions?exchange=IDX&ticker=HRTA)
  prices:
    provider: ${PRICE_PROVIDER:yahoo}   # yahoo | eodhd (eodhd needs EODHD_API_TOKEN)
    min-delay: 1s                       # random pause of min..max between two provider requests
    max-delay: 2s
    backoff: [15m, 30m, 60m]            # waits after consecutive HTTP 429; a 429 after the last one stops the run
    session-close-cutoff: "17:00"       # exchange-local time from which today's bar is final
    full-history-from: "1990-01-01"     # start of a full-history fetch
    eodhd:
      api-token: ${EODHD_API_TOKEN:}
    fx:
      base-url: https://api.frankfurter.dev/v1   # ECB reference rates, converts listings quoted in another currency (INDY)
    schedule:
      enabled: ${PRICE_SCHEDULE_ENABLED:false}   # evening run over all active companies of the exchange
      cron: "0 30 17 * * MON-FRI"
      zone: Asia/Jakarta
      exchange: IDX

  # RAG vector store (POST /api/v1/rag/pdf, POST /api/v1/rag/news); docs/v1_docs/RAG_DOCS.md
  rag:
    embedding-model: ${RAG_EMBEDDING_MODEL:openai/text-embedding-3-small}   # via spring.ai.openai.base-url / api-key
    embedding-dimensions: 1536   # must match rag_chunk.embedding vector(1536)
    embedding-batch: 64          # chunks per embedding request
    chunk-chars: 1500            # target chunk length (characters)
    chunk-overlap: 200           # characters a chunk repeats from the previous one
    news-max-pages: 10           # tag pages per news site walked back to reach the range start
    news-max-articles: 60        # articles read and stored per news job (newest first)
    article-chars: 30000         # longest article text kept
    news-retries: 3              # more attempts at a news page after a network error, timeout, 429 / 5xx (404 for an article)
    news-retry-backoff: 2s       # pause before the first retry, doubled for each further one (2 s, 4 s, 8 s)

  # AI analysis of one stock (POST /api/v1/analyses); docs/v1_docs/ANALYSIS_DOCS.md. Models, prices, score blending:
  # neracalab.screening
  analysis:
    budget-usd: ${ANALYSIS_BUDGET_USD:0.20}   # hard cost cap of one analysis (all model and embedding calls)
    synthesis-reserve-usd: 0.10               # kept free for the synthesis (Opus, about $0.09 at most) while the others run
    research-iterations: 4                    # model turns of the research agent (ReAct guard)
    max-searches: 6                           # document / news searches of the research agent
    max-statement-lookups: 3                  # full-statement lookups of the research agent
    search-results: 4                         # chunks returned per search
    excerpt-chars: 800                        # longest excerpt returned per chunk
    annual-periods: 4                         # fiscal years in the fact sheet (plus the latest interim period)
    embedding-price-per-million: 0.02         # USD per million tokens of the embedding model (estimated cost)
    agent-max-tokens: 1000                    # output limit of an investor agent answer (screening: 450; the dossier is richer)

  # AI stock screening (POST /api/v1/screenings); docs/v1_docs/SCREENING_DOCS.md
  screening:
    budget-usd: ${SCREENING_BUDGET_USD:0.45}       # hard cost cap of one run (all model calls)
    synthesis-reserve-usd: 0.15                     # kept free for the final synthesis while Stage 2 runs
    shortlist-multiplier: 3                         # Stage 1 shortlist = top N x 3 (75 for a top 25)
    max-shortlist: 100
    max-top-n: 50
    llm-weight: 0.4                                 # agent score = 0.6 x quantitative + 0.4 x model score
    risk-weight: 0.2                                # overall = 0.8 x investor average + 0.2 x Risk agent
    large-cap-min: 10000000000000                   # Rp 10T
    mid-cap-min: 1000000000000                      # Rp 1T (below: small cap)
    min-price: 50                                   # IDX special-monitoring board trades below Rp 50
    min-avg-daily-value-large: 5000000000           # Rp 5B traded per day
    min-avg-daily-value-mid: 1000000000             # Rp 1B
    min-avg-daily-value-small: 200000000            # Rp 200M
    max-trade-age: 10d                              # no trade for longer = suspended
    require-positive-earnings: true
    excluded-tickers: []                            # e.g. known watchlist-board stocks
    min-fundamentals-coverage: 0.5
    llm:
      research-model: ${SCREENING_RESEARCH_MODEL:deepseek/deepseek-v4-flash-0731}
      agent-model: ${SCREENING_AGENT_MODEL:deepseek/deepseek-v4-flash-0731}
      synthesis-model: ${SCREENING_SYNTHESIS_MODEL:anthropic/claude-opus-5.5}
      synthesis-effort: low
      provider-sort: price                          # OpenRouter: cheapest provider for the DeepSeek calls
      provider-ignore: ${SCREENING_PROVIDER_IGNORE:OpenInference}   # never these providers (OpenInference's fp4 DeepSeek loops)
      concurrency: 8
      research-iterations: 3
      agent-max-tokens: 450
      synthesis-max-tokens: 12000
      model-retries: 2                              # retries of a model call that failed transiently (stream reset, 408/429/5xx)
      retry-backoff: 2s                             # pause before the first retry, doubled for each further one
    news:
      tavily-api-key: ${TAVILY_API_KEY:}
      tavily-max-results: 5
      cache-ttl: 12h                                # a source is asked about a ticker again after 12 h
      max-age: 120d                                 # older articles are ignored
      headlines-per-stock: 8
      article-chars: 1500
      min-delay: 1s                                 # pause between two requests to the same news site
      max-delay: 2s
    etl:
      fundamentals-max-age: 7d                      # fundamentals are refreshed weekly, market data daily
      schedule:
        enabled: ${SCREENING_ETL_SCHEDULE_ENABLED:true}
        cron: "0 0 18 * * MON-FRI"
        zone: Asia/Jakarta
        exchange: IDX
