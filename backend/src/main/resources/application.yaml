spring:
  application:
    name: backend
  config:
    # Local secrets (OPENAI_API_KEY, ...) from backend/.env; the file is git- and docker-ignored.
    # Real environment variables take precedence.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  ai:
    # Spring AI is used for chat only (Spring AI's own embedding / image / audio models are off). The RAG
    # embeddings call OpenRouter's OpenAI-compatible /embeddings directly (neracalab.rag below).
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        model: ${OPENAI_MODEL:deepseek/deepseek-v4.1-flash-1017}
        parallel-tool-calls: true
        timeout: 180s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neracalab}
    username: ${DB_USERNAME:neracalab}
    password: ${DB_PASSWORD:neracalab}
  data:
    redis:
      # Redis of backend/docker-compose.yaml (the backend container sets SPRING_DATA_REDIS_HOST=redis); the Macro page's
      # outlook cache (neracalab.macro.outlook-cache). Unreachable: the outlook is computed for every request.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:neracalab}
      timeout: 2s
      connect-timeout: 1s
  sql:
    init:
      # Plain SQL scripts instead of Flyway (V1.0.1, V1.0.2, V1.0.3 ... run in the listed order);
      # all scripts are idempotent and run on every start. Add new scripts to the lists below;
      # company data scripts go before V1.0.6 (it derives metrics from all loaded data).
      mode: ${SQL_INIT_MODE:always}
      schema-locations:
        - classpath:db/V1.0.1__schema.sql
        - classpath:db/V1.0.2__schema_market_valuation.sql
        - classpath:db/V1.0.3__views.sql
        - classpath:db/V1.0.7__schema_ingestion.sql
        - classpath:db/V1.0.8__schema_auth.sql
        - classpath:db/V1.0.9__schema_ingestion_created_by.sql
        - classpath:db/V1.0.10__schema_screening.sql
        - classpath:db/V1.0.11__schema_fx.sql
        - classpath:db/V1.0.14__schema_rag.sql      # RAG vector store (needs pgvector)
        - classpath:db/V1.0.15__schema_analysis.sql # AI analysis of one stock
        - classpath:db/V1.0.16__schema_syirkah.sql  # banks: temporary syirkah funds beside liabilities
        - classpath:db/V1.0.17__schema_screening_selection.sql # screening of selected stocks
        - classpath:db/V1.0.18__schema_ingestion_error.sql     # error log of the .xlsx ingestion API
        - classpath:db/V1.0.19__schema_ingestion_cost.sql      # model cost of the .xlsx ingestion (llm_usage.job_id)
        - classpath:db/V1.0.20__schema_screening_currency.sql  # currency of the screening fundamentals (USD reporters)
        - classpath:db/V1.0.23__schema_technical.sql           # technical analysis: index, events, macro, snapshots, chart settings
        - classpath:db/V1.0.25__schema_markets_macro.sql       # Forex / commodity bars, macro series catalog and release dates
        - classpath:db/V1.0.27__schema_macro_analysis.sql      # AI macro analysis of a country (Macro > AI Analysis)
        - classpath:db/V1.0.28__schema_rag_macro.sql           # macro documents of a country in the RAG vector store
        - classpath:db/V1.0.29__schema_registration.sql        # company PDF types; monthly registration reports (Companies > Registration)
        - classpath:db/V1.0.30__schema_technical_screening.sql # bars of the screening universe; AI technical screening (Screening > Technicals)
        - classpath:db/V1.0.32__schema_registration_holders.sql # registration reports: shareholders of 5% or more, shares by type of holder
        - classpath:db/V1.0.33__schema_ownership.sql            # KSEI daily lists of the shareholders of more than 5% (Companies > Ownership)
        - classpath:db/V1.0.34__schema_ownership_one_percent.sql # KSEI monthly lists of the shareholders of more than 1% (Companies > Ownership (>=1%))
        - classpath:db/V1.0.36__schema_valuation_ebitda_basis.sql # the EBITDA of EV / EBITDA: TTM, else the full year
        - classpath:db/V1.0.40__schema_dev_context.sql            # development context of Claude Code (RAG)
      data-locations:
        - classpath:db/V1.0.4__data_HRTA_financials.sql
        - classpath:db/V1.0.5__data_HRTA_market.sql
        - classpath:db/V1.0.12__data_SMDR_shares.sql      # share counts not derivable from the filings
        - classpath:db/V1.0.13__data_BNGA_shares.sql      # share counts not derivable from the filings
        - classpath:db/V1.0.21__data_RAJA_shares.sql      # share counts and the 1:5 split of 2026-07-16
        - classpath:db/V1.0.22__data_TUGU_shares.sql      # the 1:2 split of 2023-05-24 no filing restates
        - classpath:db/V1.0.24__data_BACH_shares.sql      # share count after the IPO of 2026-07-08
        - classpath:db/V1.0.31__data_BNBR_shares.sql      # share counts of five par-value series (2023 - 2026 rights issue)
        - classpath:db/V1.0.35__data_ENRG_shares.sql      # share counts (USD filings without them), the June 2026 placement
        - classpath:db/V1.0.37__data_RANS_shares.sql      # share counts before and after the IPO of 2026-07-10
        - classpath:db/V1.0.38__data_ABDA_expenses.sql    # FY2021 / FY2022 G&A its FY2022 filing tags as interest
        - classpath:db/V1.0.39__data_ACRO_AGAR_AISA_shares.sql # share counts their filings and Yahoo Finance do not give
        - classpath:db/V1.0.41__data_ALKA_AMAN_AREA_ATAP_BATR_shares.sql # share counts from KSEI and the listing records
        - classpath:db/V1.0.42__data_BBHI_shares.sql      # the 2025-06-30 count its annualized H1 EPS halved
        - classpath:db/V1.0.6__data_metrics_valuation.sql
        - classpath:db/V1.0.26__data_markets_macro.sql    # catalog of the Forex pairs, commodities and macro series
      continue-on-error: false
  jpa:
    hibernate:
      # Schema is owned by the SQL scripts above; Hibernate must not alter it.
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false

server:
  tomcat:
    # Read the rest of an upload over the multipart limit (default 2 MB) so the client gets the 413, not a reset connection
    max-swallow-size: 60MB

neracalab:
  # The DeepSeek calls of the ingestion and the screening through OpenCode Go (monthly subscription) instead of
  # OpenRouter (OpenCodeGoRouting); Claude and the embeddings stay on OpenRouter. Off without a key.
  llm:
    opencode-go:
      api-key: ${OPENCODE_GO_API_KEY:}
      base-url: ${OPENCODE_GO_BASE_URL:https://opencode.ai/inference/go/openai/v1}
      # OpenRouter id = OpenCode Go id; models not listed stay on OpenRouter. Claude Haiku 5.5: the full-text
      # extraction (neracalab.ingestion.fallback.model)
      models: ${OPENCODE_GO_MODELS:deepseek/deepseek-v4.1-flash-1017=deepseek-v4.1-flash,anthropic/claude-haiku-5.5=claude-haiku-5-5}

  # Login (POST /api/v1/auth/login); every other API needs the bearer token of a session
  auth:
    session-ttl: ${AUTH_SESSION_TTL:12h}            # a login is valid this long
    root-password: ${AUTH_ROOT_PASSWORD:admin}      # password of the root user "admin" when it is first created

  # Background jobs of the ingestion APIs: financial statement uploads, prices, RAG PDF / news, screening data
  jobs:
    # Worker threads of EACH ingestion queue: that many of its jobs run at the same time, the rest wait their turn.
    # The requests to Yahoo Finance and to each news site stay paced one at a time (more workers do not send
    # requests faster).
    workers: ${INGESTION_WORKERS:5}

  # AI ingestion agent (POST /api/v1/financial-statements/upload)
  ingestion:
    max-iterations: 30      # model turns per execution round
    reflection-rounds: 2    # extra rounds the reviewer may request
    temperature: 0.0
    model-retries: 2        # retries of a model call that failed transiently (timeout, network, 408/429/5xx)
    retry-backoff: 2s       # pause before the first retry, doubled for each further one
    model-reasoning: ${INGESTION_MODEL_REASONING:false}   # let a reasoning model think first (slow: 69 s vs 10 s per plan)
    model-call-timeout: ${INGESTION_MODEL_CALL_TIMEOUT:45s}   # a model call taking longer counts as stalled and is retried
    provider-ignore: ${INGESTION_PROVIDER_IGNORE:OpenInference}   # OpenRouter providers never used (OpenInference's DeepSeek loops for 60 s)
    web-share-counts: ${INGESTION_WEB_SHARE_COUNTS:true}   # Yahoo Finance share counts when a filing gives none
    job-timeout: ${INGESTION_JOB_TIMEOUT:5m}   # an upload job running longer is stopped and FAILED (queue time not counted)
    # A filing holds no prices, and without prices a company has no market cap and no valuation: when a filing was
    # stored, the company's daily prices are queued too (nothing when they already reach the last completed trading day).
    prices-after-upload: ${INGESTION_PRICES_AFTER_UPLOAD:true}
    # Full-text extraction: takes over when the standard extraction (the AI agent above) does not store a workbook -
    # it cannot map it ("No balance sheet data"), leaves open items (INCOMPLETE), fails, or runs longer than `after`.
    # The model then decides every value that is not stored yet from the text of the whole workbook (it names the rows,
    # the amounts are read from the cells); no rule of the Java code overrules it.
    # Every such upload is recorded in the table ingestion_error (fixed_by_claude_code).
    fallback:
      # its own model (OpenRouter id), stronger than the standard extraction's; empty = spring.ai.openai.chat.model.
      # Claude Haiku 5.5, through OpenCode Go when its key is set (neracalab.llm.opencode-go), else OpenRouter
      model: ${INGESTION_FALLBACK_MODEL:anthropic/claude-haiku-5.5}
      # reasoning effort of its calls; Sonnet 5.5 refuses reasoning switched off (HTTP 400, error 878).
      # Empty = neracalab.ingestion.model-reasoning, as the standard extraction
      reasoning-effort: ${INGESTION_FALLBACK_REASONING_EFFORT:low}
      enabled: ${INGESTION_FALLBACK_ENABLED:true}
      after: ${INGESTION_FALLBACK_AFTER:3m}       # longest the standard extraction runs before the full-text one takes over
      timeout: ${INGESTION_FALLBACK_TIMEOUT:5m}   # longest the full-text extraction runs (room for two provider retries); then FAILED
      model-call-timeout: 150s                    # one of its model calls (one long JSON answer)
      max-chars: 120000                           # most workbook text sent to the model (statement sheets first)
      rounds: 3                                   # answers of the model: the first, then corrections of rejected mappings
    # true: filings of one company are stored one after the other in upload order (other companies still beside
    # them): a job never verifies a period while another filing of the company is writing it, and a filing in another
    # currency is checked against the filings stored before it (IngestionService.currencyConflict). false: at the same
    # time (up to neracalab.jobs.workers) - filings of one company uploaded together then each pass the currency check
    # before any of them is stored (ANJT FY2025 in USD stored beside H1 / 9M 2026 in IDR; DEWA FY2021 / FY2022).
    same-company-in-order: ${INGESTION_SAME_COMPANY_IN_ORDER:true}

  # Daily price ingestion (POST /api/v1/prices/ingestions?exchange=IDX&ticker=HRTA)
  prices:
    provider: ${PRICE_PROVIDER:yahoo}   # yahoo | eodhd (eodhd needs EODHD_API_TOKEN)
    min-delay: 1s                       # random pause of min..max between two provider requests
    max-delay: 2s
    backoff: [15m, 30m, 60m]            # waits after consecutive HTTP 429; a 429 after the last one stops the run
    session-close-cutoff: "17:00"       # exchange-local time from which today's bar is final
    full-history-from: "1990-01-01"     # start of a full-history fetch
    eodhd:
      api-token: ${EODHD_API_TOKEN:}
    fx:
      base-url: https://api.frankfurter.dev/v1   # ECB reference rates, converts listings quoted in another currency (INDY)
    schedule:
      enabled: ${PRICE_SCHEDULE_ENABLED:false}   # evening run: the companies of the exchange behind, and IHSG
      cron: "0 30 17 * * MON-FRI"
      zone: Asia/Jakarta
      exchange: IDX

  # Forex pairs and commodities (Price Ingestion with the market Forex / Commodities, /api/v1/markets; charted on
  # Technicals). The catalog is market_instrument (V1.0.26__data_markets_macro.sql): USD/IDR, USD/JPY and the daily
  # commodities (Brent, WTI, natural gas, gold, silver, copper, aluminium, iron ore, steel, palm oil in USD and in
  # ringgit, soybean oil and meal, corn, wheat, sugar) from Yahoo Finance through the price queue; coal, LNG, nickel,
  # tin, rubber, urea, DAP and potash monthly from the World Bank Pink Sheet, cobalt from the IMF and the wood pulp price
  # index from FRED (neracalab.macro.fred-base-url).
  markets:
    world-bank:
      page-url: https://www.worldbank.org/en/research/commodity-markets   # links the current CMO-Historical-Data-Monthly.xlsx
      file-url: ${WORLD_BANK_PINK_SHEET_URL:}                             # the workbook itself; empty = the link on page-url
    imf:
      base-url: https://api.imf.org/external/sdmx/3.0                     # IMF Primary Commodity Prices (SDMX, no key)

  # Macro data of the Druckenmiller and Paul Tudor Jones views (Ingestion > Macro, /api/v1/macro; macro.md). The catalog
  # is macro_series_def (V1.0.26__data_markets_macro.sql): FRED, Bank Indonesia (indicator pages and SEKI tables), CNBC
  # (SBN 10Y), CFTC (positioning), Yahoo Finance (DXY); the series without a readable source take a CSV upload.
  macro:
    overlap-days: 45                    # an update re-reads the last 45 days, so revisions are picked up
    outlook-cache:                      # the Macro page's outlook in Redis; cleared by every write of its data and every start
      enabled: ${MACRO_OUTLOOK_CACHE_ENABLED:true}
      ttl: 1h                           # bounds a change made outside the application (SQL by hand)
    schedule:
      enabled: ${MACRO_SCHEDULE_ENABLED:false}   # evening run: every series whose next release is due
      cron: "0 0 20 * * *"
      zone: Asia/Jakarta

  # The polite HTTP client of the crawlers (the macro sources and the World Bank): one request per host at a time and
  # min-delay between two, a User-Agent that names the application, no retries around a refusal.
  crawl:
    min-delay: 2s
    request-timeout: 90s

  # Technical analysis (Companies > Technicals, /api/v1/technical); docs/v1_docs/TECHNICAL_DOCS.md. No model is called:
  # every value is computed in Java. The snapshot JSON is documented in docs/indicator-snapshot.md.
  technical:
    index:
      code: IHSG                     # benchmark of relative strength and the market regime (index_daily.index_code)
      yahoo-symbol: "^JKSE"          # Jakarta Composite Index on Yahoo Finance
      exchange: IDX
      history-from: "1990-01-01"     # start of the first index fetch
    other-indexes:                   # stored with the benchmark, in the same run (the Macro page's index dropdown)
      - code: LQ45
        yahoo-symbol: "^JKLQ45"      # IDX LQ45 on Yahoo Finance (monthly from 1997)
        exchange: IDX
        history-from: "1997-01-01"
    min-history-days: 250            # fewer trading days: "limited history" warning
    cache-size: 200                  # chart series kept in memory (ticker x interval x price basis)
    cache-ttl: 12h
    lot-size: 100                    # shares per lot on IDX
    tick-sizes:                      # IDX price fractions (fraksi harga): tick of prices below 'below'; the last band is open
      - { below: 200, tick: 1 }
      - { below: 500, tick: 2 }
      - { below: 2000, tick: 5 }
      - { below: 5000, tick: 10 }
      - { tick: 25 }
    # IDX auto-rejection limits (ARA up / ARB down) by effective date and previous-close band ('up-to' inclusive, the
    # last band open). Detection: close at the day's high (low) and within one tick of the limit. Verify against the
    # exchange's current rules before relying on the counts.
    auto-rejection:
      - from: "1990-01-01"
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
      - from: "2020-03-10"           # Covid: ARB 10 %
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { pct: 0.10 } ]
      - from: "2020-03-13"           # ARB 7 %
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { pct: 0.07 } ]
      - from: "2023-06-05"           # normalisation phase 1: ARB 15 %
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { pct: 0.15 } ]
      - from: "2023-09-04"           # phase 2: ARB symmetric with ARA
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
      - from: "2025-04-08"           # ARB 15 % again
        ara: [ { up-to: 200, pct: 0.35 }, { up-to: 5000, pct: 0.25 }, { pct: 0.20 } ]
        arb: [ { pct: 0.15 } ]
    pivot:
      bars-each-side: 2              # 5-bar fractals
    zones:
      tolerance-pct: 0.02            # swing points within 2 % of a zone's mean join it
      lookback-days: 250
      max-zones: 8
      min-width-pct: 0.005           # half-width of a zone of one swing point
    volume-profile:
      days: 120
      buckets: 24
      top-nodes: 3
    retracement:
      major-swing-atr: 3             # a major swing spans at least 3 x ATR(14)
      ratios: [0.33, 0.382, 0.5, 0.618, 0.66]
    base:
      min-days: 60
      max-days: 120
      max-depth-pct: 0.25            # (high - low) / low of the base at most 25 %
      max-atr-contraction: 0.9       # ATR% of the last third <= 0.9 x that of the first third
    volume:
      spike-multiple: 2.0            # volume >= 2 x the 50-day average
    events:
      refresh-after: 7d              # Yahoo Finance dividends / splits of a listing are fetched again after 7 days
      upcoming-days: 60
    schedule:
      enabled: ${TECHNICAL_SCHEDULE_ENABLED:true}   # nightly: index, due events, snapshots of every active listing
      cron: "0 0 19 * * MON-FRI"
      zone: Asia/Jakarta
      exchange: IDX

  # RAG vector store (POST /api/v1/rag/pdf, POST /api/v1/rag/news); docs/v1_docs/RAG_DOCS.md
  rag:
    embedding-model: ${RAG_EMBEDDING_MODEL:openai/text-embedding-3-small}   # via spring.ai.openai.base-url / api-key
    embedding-dimensions: 1536   # must match rag_chunk.embedding vector(1536)
    embedding-batch: 64          # chunks per embedding request
    chunk-chars: 1500            # target chunk length (characters)
    chunk-overlap: 200           # characters a chunk repeats from the previous one
    news-max-pages: 10           # tag pages per news site walked back to reach the range start
    news-max-articles: 60        # articles read and stored per news job (newest first)
    article-chars: 30000         # longest article text kept
    news-retries: 3              # more attempts at a news page after a network error, timeout, 429 / 5xx (404 for an article)
    news-retry-backoff: 2s       # pause before the first retry, doubled for each further one (2 s, 4 s, 8 s)

  # AI analysis of one stock (POST /api/v1/analyses); docs/v1_docs/ANALYSIS_DOCS.md. Models, prices, score blending:
  # neracalab.screening
  analysis:
    budget-usd: ${ANALYSIS_BUDGET_USD:0.20}   # hard cost cap of one analysis (all model and embedding calls)
    synthesis-reserve-usd: 0.10               # kept free for the synthesis (Opus, about $0.09 at most) while the others run
    research-iterations: 4                    # model turns of the research agent (ReAct guard)
    max-searches: 6                           # document / news searches of the research agent
    max-statement-lookups: 3                  # full-statement lookups of the research agent
    search-results: 4                         # chunks returned per search
    excerpt-chars: 800                        # longest excerpt returned per chunk
    annual-periods: 4                         # fiscal years in the fact sheet (plus the latest interim period)
    embedding-price-per-million: 0.02         # USD per million tokens of the embedding model (estimated cost)
    agent-max-tokens: 1000                    # output limit of an investor agent answer (screening: 450; the dossier is richer)

  # AI macro analysis of a country (POST /api/v1/macro/analyses); docs/v1_docs/MACRO_ANALYSIS_DOCS.md. Models and
  # prices: neracalab.screening.llm
  macro-analysis:
    budget-usd: ${MACRO_ANALYSIS_BUDGET_USD:0.20}  # hard cost cap of one macro analysis (all model calls)
    synthesis-reserve-usd: 0.10                    # kept free for the synthesis (Opus) while the others run
    research-iterations: 4                         # model turns of the research agent (ReAct guard)
    max-tool-calls: 8                              # history and correlation lookups of the research agent
    history-months: 36                             # most months one history lookup returns
    max-document-searches: 4                       # searches in the country's macro documents (RAG), if any are stored
    document-results: 4                            # chunks returned per document search
    excerpt-chars: 700                             # longest excerpt returned per chunk
    embedding-price-per-million: 0.02              # USD per million tokens of the embedding model (estimated cost)
    agent-max-tokens: 1000                         # output limit of a macro agent answer or review
    prior-weight: 0.6                              # agent score = 60% its rules preset + 40% its AI judgement
    rules-weight: 0.2                              # investability = 80% the agents' mean + 20% the rules score

  # AI stock screening (POST /api/v1/screenings); docs/v1_docs/SCREENING_DOCS.md
  screening:
    budget-usd: ${SCREENING_BUDGET_USD:0.45}       # hard cost cap of one run (all model calls)
    synthesis-reserve-usd: 0.15                     # kept free for the final synthesis while Stage 2 runs
    shortlist-multiplier: 3                         # Stage 1 shortlist = top N x 3 (75 for a top 25)
    max-shortlist: 100
    max-top-n: 50
    llm-weight: 0.4                                 # agent score = 0.6 x quantitative + 0.4 x model score
    risk-weight: 0.2                                # overall = 0.8 x investor average + 0.2 x Risk agent
    large-cap-min: 10000000000000                   # Rp 10T
    mid-cap-min: 1000000000000                      # Rp 1T (below: small cap)
    min-price: 50                                   # IDX special-monitoring board trades below Rp 50
    min-avg-daily-value-large: 5000000000           # Rp 5B traded per day
    min-avg-daily-value-mid: 1000000000             # Rp 1B
    min-avg-daily-value-small: 200000000            # Rp 200M
    max-trade-age: 10d                              # no trade for longer = suspended
    require-positive-earnings: true
    excluded-tickers: []                            # e.g. known watchlist-board stocks
    min-fundamentals-coverage: 0.5
    llm:
      research-model: ${SCREENING_RESEARCH_MODEL:deepseek/deepseek-v4.1-flash-1017}
      agent-model: ${SCREENING_AGENT_MODEL:deepseek/deepseek-v4.1-flash-1017}
      synthesis-model: ${SCREENING_SYNTHESIS_MODEL:anthropic/claude-opus-5.5}
      synthesis-effort: low
      provider-sort: price                          # OpenRouter: cheapest provider for the DeepSeek calls
      provider-ignore: ${SCREENING_PROVIDER_IGNORE:OpenInference}   # never these providers (OpenInference's fp4 DeepSeek loops)
      concurrency: 8
      research-iterations: 3
      agent-max-tokens: 450
      synthesis-max-tokens: 12000
      model-retries: 2                              # retries of a model call that failed transiently (stream reset, 408/429/5xx)
      retry-backoff: 2s                             # pause before the first retry, doubled for each further one
    news:
      tavily-api-key: ${TAVILY_API_KEY:}
      tavily-max-results: 5
      cache-ttl: 12h                                # a source is asked about a ticker again after 12 h
      max-age: 120d                                 # older articles are ignored
      headlines-per-stock: 8
      article-chars: 1500
      min-delay: 1s                                 # pause between two requests to the same news site
      max-delay: 2s
    etl:
      fundamentals-max-age: 7d                      # fundamentals are refreshed weekly, market data daily
      schedule:
        enabled: ${SCREENING_ETL_SCHEDULE_ENABLED:true}
        cron: "0 0 18 * * MON-FRI"
        zone: Asia/Jakarta
        exchange: IDX

  # AI technical screening (POST /api/v1/technical-screenings: Screening > Technicals (All) / (Selected));
  # docs/v1_docs/TECHNICAL_SCREENING_DOCS.md. Models and prices: neracalab.screening.llm (DeepSeek for the four technical
  # agents and the reflection, Opus for the synthesis); market-cap tiers, price and liquidity minimums:
  # neracalab.screening. Price movements: listing_price_daily (Ingestion > Screening Data IDX) for a tier, price_daily
  # (the companies table) for selected stocks.
  technical-screening:
    budget-usd: ${TECHNICAL_SCREENING_BUDGET_USD:0.50}   # hard cost cap of one run (all model calls)
    synthesis-reserve-usd: 0.20                    # kept free for the synthesis (Opus) while the agents run
    shortlist-multiplier: 3                        # Stage 1 shortlist = top N x 3 (75 for a top 25)
    max-shortlist: 100
    max-top-n: 50
    llm-weight: 0.4                                # agent score = 0.6 x its rules summary + 0.4 x its AI judgement
    min-bars: 120                                  # Stage 1: fewer stored daily bars = too little history
    max-bar-age: 7d                                # Stage 1: a last bar older than this before the as-of day = stale
    agent-max-tokens: 700                          # output limit of one agent answer (score, stance, trade plan, reasons)
    synthesis-max-tokens: 16000                    # output limit of the synthesis (thinking included)
    price-history:
      years: 5                                     # a listing's first load reaches this far back (SMA 200, 52 weeks, 12-1 momentum)
      refresh-before-run: true                     # a tier screening first loads the bars of its listings that are behind
